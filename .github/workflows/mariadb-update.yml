name: Update MariaDB base image

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  check-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Check for new MariaDB version
        id: check
        run: |
          CURRENT=$(grep -oP 'FROM docker\.io/library/mariadb:\K[0-9]+\.[0-9]+\.[0-9]+' Dockerfile)
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)

          LATEST=$(curl -s "https://hub.docker.com/v2/repositories/library/mariadb/tags?page_size=100" \
            | jq -r '.results[].name' \
            | grep -E "^${MAJOR}\.[0-9]+\.[0-9]+$" \
            | sort -V \
            | tail -1)

          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "latest=$LATEST" >> $GITHUB_OUTPUT

          if [ "$CURRENT" != "$LATEST" ]; then
            echo "update=true" >> $GITHUB_OUTPUT
            echo "New MariaDB version found: $CURRENT -> $LATEST"
          else
            echo "update=false" >> $GITHUB_OUTPUT
            echo "Already up to date: $CURRENT"
          fi

      - name: Update Dockerfile
        if: steps.check.outputs.update == 'true'
        run: |
          CURRENT="${{ steps.check.outputs.current }}"
          LATEST="${{ steps.check.outputs.latest }}"
          sed -i "s|FROM docker.io/library/mariadb:${CURRENT}|FROM docker.io/library/mariadb:${LATEST}|" Dockerfile

      - name: Commit, tag and push
        if: steps.check.outputs.update == 'true'
        run: |
          LATEST="${{ steps.check.outputs.latest }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Dockerfile
          git commit -m "chore: update MariaDB base image to ${LATEST}"
          git tag "${LATEST}"
          git push origin HEAD
          git push origin "${LATEST}"
